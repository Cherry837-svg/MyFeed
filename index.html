<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7779B9">
  <title>MyFeed</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --background:#7779B9; --card:#8587C5; --button:#202844;
      --button-hover:#303F83; --lilac:#B4A1D5; --text:#fff;
      --muted:#E2E3F5; --border:rgba(180,161,213,.75);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--background); color:var(--text); font-family:Arial,sans-serif; min-height:100vh; padding:18px 12px 40px; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; border:1px solid var(--lilac); border-radius:12px; background:var(--button); color:#fff; padding:11px 15px; min-height:44px; }
    button:hover { background:var(--button-hover); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    input,textarea { width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:#F4F3FF; color:#20213B; margin-top:6px; }
    textarea { min-height:120px; resize:vertical; }
    label { display:block; margin-top:14px; font-size:14px; }
    .app { max-width:760px; margin:0 auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; padding:18px; border:1px solid var(--border); border-radius:18px; background:rgba(32,40,68,.24); }
    .logo { font-size:29px; font-weight:800; letter-spacing:.5px; }
    .subtitle { color:var(--muted); font-size:13px; margin-top:5px; }
    .header-actions,.actions { display:flex; flex-wrap:wrap; gap:8px; }
    .panel,.post { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:17px; margin-bottom:16px; box-shadow:0 5px 16px rgba(24,25,58,.12); overflow-wrap:anywhere; }
    .status { font-size:13px; color:var(--muted); line-height:1.5; margin:10px 0; overflow-wrap:anywhere; }
    .post-title { font-size:20px; margin-bottom:8px; }
    .post-date { color:var(--muted); font-size:12px; margin-bottom:12px; }
    .post-text { white-space:pre-wrap; line-height:1.55; margin:12px 0; }
    .editor { display:none; }
    .editor.open { display:block; }
    .check-row { display:flex; align-items:center; gap:10px; margin:15px 0; }
    .check-row input { width:20px; height:20px; margin:0; }
    .primary { background:#263F83; font-weight:bold; }
    .danger { background:#704568; }
    .empty { text-align:center; color:var(--muted); padding:28px 10px; line-height:1.7; }
    .media-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin:12px 0; }
    .media-item { min-width:0; padding:8px; border:1px solid var(--border); border-radius:12px; background:rgba(32,40,68,.12); }
    .media-image,.media-item video { display:block; width:100%; max-height:420px; object-fit:contain; border-radius:8px; }
    .media-item audio { width:100%; }
    .media-name { font-size:12px; color:var(--muted); overflow-wrap:anywhere; margin:7px 0; }
    .media-actions { margin-top:7px; }
    .media-actions a { color:white; }
    footer { text-align:center; color:var(--muted); font-size:12px; padding:14px; }
    [hidden] { display:none !important; }
    @media(max-width:480px) {
      body { padding:10px 8px 28px; }
      header,.panel,.post { padding:13px; border-radius:14px; }
      .logo { font-size:25px; }
      .header-actions { width:100%; }
      .header-actions button { flex:1; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="logo">MyFeed</div><div class="subtitle">Твоя лента публикаций</div></div>
    <div class="header-actions">
      <button id="loginButton" type="button">Войти через Google</button>
      <button id="logoutButton" type="button" hidden>Выйти</button>
    </div>
  </header>

  <section class="panel">
    <div id="status" class="status" role="status" aria-live="polite">Подключаемся к базе данных...</div>
    <button id="newButton" class="primary" type="button" disabled>+ Новая публикация</button>
  </section>

  <section id="editor" class="panel editor">
    <h2 id="editorHeading">Новая публикация</h2>
    <form id="postForm">
      <label for="postTitle">Заголовок</label>
      <input id="postTitle" type="text" maxlength="200" placeholder="Введите заголовок">
      <label for="postText">Текст публикации</label>
      <textarea id="postText" maxlength="20000" placeholder="Напишите что-нибудь..."></textarea>
      <label for="mediaFiles">Фотографии, видео или аудио (можно выбрать несколько)</label>
      <input id="mediaFiles" type="file" accept="image/*,video/*,audio/*,.mp3,.m4a,.wav,.ogg,.mp4,.webm,.mov" multiple>
      <div id="selectedFiles" class="status">Новые файлы не выбраны.</div>
      <label class="check-row"><input id="allowComments" type="checkbox" checked><span>Разрешить комментарии</span></label>
      <div class="actions">
        <button id="saveButton" class="primary" type="submit">Опубликовать</button>
        <button id="cancelButton" type="button">Отмена</button>
      </div>
    </form>
  </section>

  <main id="feed" aria-live="polite"><div class="empty">Загружаем публикации...</div></main>
  <footer>MyFeed</footer>
</div>

<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://wzypdsspmwopehcurzzx.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_HT9K7erIXZ2KuwxOIxKqiA_SVRA7EEo";
  const STORAGE_BUCKET = "MyFeed";
  const MEDIA_MARKER = "\n\n[[MYFEED_MEDIA_V1:";

  const $ = id => document.getElementById(id);
  const statusElement = $("status"), feed = $("feed"), editor = $("editor"), form = $("postForm");
  const loginButton = $("loginButton"), logoutButton = $("logoutButton"), newButton = $("newButton");
  const saveButton = $("saveButton"), cancelButton = $("cancelButton");
  const titleInput = $("postTitle"), textInput = $("postText"), commentsInput = $("allowComments");
  const filesInput = $("mediaFiles"), selectedFiles = $("selectedFiles"), editorHeading = $("editorHeading");

  let db = null, currentUser = null, editingPost = null, loading = false, currentMedia = [];

  function setStatus(message) { statusElement.textContent = message; }
  function showError(message, error) {
    console.error(message, error);
    setStatus(message + " " + (error?.message || "Подробности доступны в консоли браузера."));
  }
  function formatDate(value) {
    const date = new Date(value);
    return value && !Number.isNaN(date.getTime()) ? date.toLocaleString("ru-RU") : "";
  }
  function showEmpty(message) {
    feed.replaceChildren();
    const box = document.createElement("div");
    box.className = "empty"; box.textContent = message; feed.appendChild(box);
  }
  function updateButtons() {
    loginButton.hidden = Boolean(currentUser);
    logoutButton.hidden = !currentUser;
    newButton.disabled = !currentUser;
    if (currentUser) setStatus("Вы вошли в аккаунт: " + (currentUser.email || ""));
    else setStatus("База подключена. Войдите через Google, чтобы публиковать записи.");
  }

  function parseStoredContent(content) {
    const value = String(content || "");
    const markerIndex = value.lastIndexOf(MEDIA_MARKER);
    if (markerIndex < 0) return { text: value, media: [] };
    const jsonStart = markerIndex + MEDIA_MARKER.length;
    const jsonEnd = value.indexOf("]]", jsonStart);
    if (jsonEnd < 0) return { text: value, media: [] };
    try {
      const media = JSON.parse(value.slice(jsonStart, jsonEnd));
      if (!Array.isArray(media)) return { text: value, media: [] };
      return {
        text: value.slice(0, markerIndex),
        media: media.filter(item => item && typeof item.url === "string" &&
          ["image", "audio", "video"].includes(item.type))
      };
    } catch (error) {
      console.warn("Не удалось прочитать сведения о медиа:", error);
      return { text: value, media: [] };
    }
  }
  function makeStoredContent(text, media) {
    return media.length ? text + MEDIA_MARKER + JSON.stringify(media) + "]]" : text;
  }
  function detectMediaType(file) {
    const mime = (file.type || "").toLowerCase();
    const name = (file.name || "").toLowerCase();
    if (mime.startsWith("image/") || /\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif)$/.test(name)) return "image";
    if (mime.startsWith("video/") || /\.(mp4|webm|mov|m4v|avi|mkv|3gp)$/.test(name)) return "video";
    if (mime.startsWith("audio/") || /\.(mp3|m4a|aac|wav|ogg|oga|flac|opus|wma)$/.test(name)) return "audio";
    return null;
  }
  function safeFileName(name) {
    return String(name || "file").normalize("NFKD").replace(/[^\w.-]+/g, "_").replace(/^_+|_+$/g, "").slice(-100) || "file";
  }
  async function uploadMedia(files) {
    const uploaded = [];
    for (let i = 0; i < files.length; i++) {
      const file = files[i], type = detectMediaType(file);
      if (!type) throw new Error("Неподдерживаемый тип файла: " + file.name);
      const path = currentUser.id + "/" + Date.now() + "_" + i + "_" + safeFileName(file.name);
      setStatus("Загружаем файл " + (i + 1) + " из " + files.length + ": " + file.name);
      const { error } = await db.storage.from(STORAGE_BUCKET).upload(path, file, {
        cacheControl: "3600", upsert: false, contentType: file.type || undefined
      });
      if (error) throw error;
      const { data } = db.storage.from(STORAGE_BUCKET).getPublicUrl(path);
      uploaded.push({ name: file.name, type, path, url: data.publicUrl });
    }
    return uploaded;
  }
  function addMediaToCard(parent, media) {
    if (!media.length) return;
    const grid = document.createElement("div"); grid.className = "media-grid";
    for (const item of media) {
      if (!item.url) continue;
      const box = document.createElement("div"); box.className = "media-item";
      const name = document.createElement("div"); name.className = "media-name";
      name.textContent = item.name || "Медиафайл";
      if (item.type === "image") {
        const image = document.createElement("img");
        image.className = "media-image"; image.src = item.url; image.alt = item.name || "Фотография"; image.loading = "lazy";
        image.addEventListener("click", () => window.open(item.url, "_blank", "noopener"));
        image.style.cursor = "zoom-in"; box.appendChild(image);
      } else if (item.type === "audio") {
        const audio = document.createElement("audio"); audio.controls = true; audio.preload = "metadata"; audio.src = item.url; box.appendChild(audio);
      } else if (item.type === "video") {
        const video = document.createElement("video"); video.controls = true; video.preload = "metadata"; video.playsInline = true; video.src = item.url; box.appendChild(video);
      }
      box.appendChild(name);
      const actions = document.createElement("div"); actions.className = "media-actions";
      const link = document.createElement("a"); link.href = item.url; link.target = "_blank"; link.rel = "noopener"; link.textContent = "Открыть / скачать";
      actions.appendChild(link); box.appendChild(actions); grid.appendChild(box);
    }
    parent.appendChild(grid);
  }

  function openEditor(post = null) {
    if (!currentUser) return setStatus("Сначала войдите через Google.");
    editingPost = post;
    currentMedia = post ? parseStoredContent(post.content).media.slice() : [];
    form.reset();
    titleInput.value = post?.title === "Без названия" ? "" : (post?.title || "");
    textInput.value = post ? parseStoredContent(post.content).text : "";
    commentsInput.checked = post ? Boolean(post.allow_comment) : true;
    filesInput.value = "";
    selectedFiles.textContent = currentMedia.length
      ? "Уже прикреплено файлов: " + currentMedia.length + ". Новые файлы добавятся к ним."
      : "Новые файлы не выбраны.";
    editorHeading.textContent = post ? "Редактирование публикации" : "Новая публикация";
    saveButton.textContent = post ? "Сохранить изменения" : "Опубликовать";
    editor.classList.add("open");
    editor.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function closeEditor() {
    editor.classList.remove("open"); form.reset(); editingPost = null; currentMedia = [];
    selectedFiles.textContent = "Новые файлы не выбраны.";
    editorHeading.textContent = "Новая публикация"; saveButton.textContent = "Опубликовать";
  }

  function renderPosts(posts) {
    feed.replaceChildren();
    if (!posts.length) return showEmpty("Публикаций пока нет. Создайте первую запись!");
    for (const post of posts) {
      const card = document.createElement("article"); card.className = "post";
      const title = document.createElement("h2"); title.className = "post-title"; title.textContent = post.title || "Без названия";
      const date = document.createElement("div"); date.className = "post-date"; date.textContent = formatDate(post.created_at);
      const parsed = parseStoredContent(post.content);
      card.append(title, date);
      if (parsed.text.trim()) { const body = document.createElement("div"); body.className = "post-text"; body.textContent = parsed.text; card.appendChild(body); }
      addMediaToCard(card, parsed.media);
      const comments = document.createElement("div"); comments.className = "status";
      comments.textContent = post.allow_comment ? "💬 Комментарии разрешены" : "💬 Комментарии отключены";
      card.appendChild(comments);

      if (currentUser && post.user_id === currentUser.id) {
        const actions = document.createElement("div"); actions.className = "actions";
        const edit = document.createElement("button"); edit.type = "button"; edit.textContent = "✏️ Редактировать";
        edit.addEventListener("click", () => openEditor(post));
        const del = document.createElement("button"); del.type = "button"; del.className = "danger"; del.textContent = "🗑️ Удалить";
        del.addEventListener("click", () => deletePost(post, del));
        actions.append(edit, del); card.appendChild(actions);
      }
      feed.appendChild(card);
    }
  }

  async function loadPosts() {
    if (!db || loading) return;
    loading = true;
    try {
      setStatus("Загружаем публикации из базы...");
      const { data, error } = await db.from("posts")
        .select("id, user_id, title, content, allow_comment, created_at")
        .order("created_at", { ascending: false });
      if (error) throw error;
      renderPosts(data || []);
      setStatus("Публикаций загружено: " + (data || []).length);
    } catch (error) {
      showEmpty("Не удалось загрузить публикации. Проверьте подключение и настройки таблицы posts.");
      showError("Ошибка загрузки публикаций из Supabase:", error);
    } finally { loading = false; }
  }

  async function signIn() {
    if (!db) return setStatus("Supabase не настроен. Проверьте адрес и Publishable key в коде.");
    try {
      setStatus("Открываем вход через Google...");
      const { error } = await db.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.href.split("#")[0] }
      });
      if (error) throw error;
    } catch (error) { showError("Не удалось начать вход через Google:", error); }
  }
  async function signOut() {
    if (!db) return;
    try {
      const { error } = await db.auth.signOut();
      if (error) throw error;
      currentUser = null; closeEditor(); updateButtons(); await loadPosts();
    } catch (error) { showError("Не удалось выйти из аккаунта:", error); }
  }

  async function savePost(event) {
    event.preventDefault();
    if (!db || !currentUser) return setStatus("Для сохранения публикации сначала войдите через Google.");
    const title = titleInput.value.trim(), text = textInput.value.trim(), allowComments = commentsInput.checked;
    const files = Array.from(filesInput.files || []);
    if (!title && !text && !files.length && !currentMedia.length) return setStatus("Добавьте заголовок, текст или медиафайл.");
    saveButton.disabled = true;
    try {
      let media = currentMedia.slice();
      if (files.length) media = media.concat(await uploadMedia(files));
      const values = {
        title: title || "Без названия",
        content: makeStoredContent(text, media),
        allow_comment: allowComments
      };
      const wasEditing = Boolean(editingPost);
      if (wasEditing) {
        const { data, error } = await db.from("posts")
          .update(values)
          .eq("id", editingPost.id)
          .eq("user_id", currentUser.id)
          .select("id")
          .maybeSingle();
        if (error) throw error;
        if (!data) throw new Error("Supabase не изменила запись. Проверьте, что политика UPDATE разрешает изменение записей, где user_id совпадает с auth.uid().");
      } else {
        const { error } = await db.from("posts").insert({ ...values, user_id: currentUser.id });
        if (error) throw error;
      }
      closeEditor();
      setStatus(wasEditing ? "Изменения сохранены." : "Публикация сохранена.");
      await loadPosts();
    } catch (error) {
      showError("Не удалось сохранить публикацию. Проверьте права доступа и настройки Storage:", error);
    } finally { saveButton.disabled = false; }
  }

  async function deletePost(post, button) {
    if (!currentUser || post.user_id !== currentUser.id) return setStatus("Можно удалять только собственные публикации.");
    if (!window.confirm("Удалить эту публикацию? Это действие нельзя отменить.")) return;
    button.disabled = true;
    try {
      const { data, error } = await db.from("posts")
        .delete()
        .eq("id", post.id)
        .eq("user_id", currentUser.id)
        .select("id")
        .maybeSingle();
      if (error) throw error;
      if (!data) throw new Error("Supabase не удалила запись. Проверьте, что политика DELETE разрешает удаление записей, где user_id совпадает с auth.uid().");
      const media = parseStoredContent(post.content).media;
      const paths = media.map(item => item.path).filter(path => typeof path === "string" && path.startsWith(currentUser.id + "/"));
      if (paths.length) {
        const { error: storageError } = await db.storage.from(STORAGE_BUCKET).remove(paths);
        if (storageError) console.warn("Публикация удалена, но не все файлы удалось удалить из Storage:", storageError);
      }
      setStatus("Публикация удалена.");
      await loadPosts();
    } catch (error) {
      button.disabled = false;
      showError("Не удалось удалить публикацию. Возможно, требуется разрешить DELETE для собственных записей в Supabase:", error);
    }
  }

  filesInput.addEventListener("change", () => {
    const files = Array.from(filesInput.files || []);
    selectedFiles.textContent = files.length ? "Выбрано файлов: " + files.map(file => file.name).join(", ") : "Новые файлы не выбраны.";
  });
  loginButton.addEventListener("click", signIn);
  logoutButton.addEventListener("click", signOut);
  newButton.addEventListener("click", () => openEditor());
  cancelButton.addEventListener("click", closeEditor);
  form.addEventListener("submit", savePost);

  async function start() {
    if (!window.supabase) return setStatus("Не удалось загрузить библиотеку Supabase. Проверьте интернет-соединение.");
    try {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      const { data, error } = await db.auth.getSession();
      if (error) throw error;
      currentUser = data.session ? data.session.user : null;
      updateButtons();
      await loadPosts();
      db.auth.onAuthStateChange((_event, session) => {
        currentUser = session ? session.user : null;
        updateButtons();
        if (!currentUser && editor.classList.contains("open")) closeEditor();
        setTimeout(() => loadPosts(), 0);
      });
    } catch (error) { showError("Ошибка подключения к Supabase:", error); }
  }
  start();
})();
</script>
</body>
</html>
