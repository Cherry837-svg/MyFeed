<!DOCTYPE html>
<html lang="ru">
<head>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7779B9">
    <title>MyFeed</title>
    <style>
        :root {
            --background: #7779B9;
            --card: #8587C5;
            --button: #202844;
            --button-hover: #303F83;
            --lilac: #B4A1D5;
            --text: #FFFFFF;
            --muted: #E2E3F5;
            --border: rgba(180, 161, 213, 0.75);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 18px 12px 40px;
        }
        button, input, textarea {
            font: inherit;
        }
        button {
            cursor: pointer;
            border: 1px solid var(--lilac);
            border-radius: 12px;
            background: var(--button);
            color: white;
            padding: 11px 15px;
            min-height: 44px;
        }
        button:hover {
            background: var(--button-hover);
        }
        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #F4F3FF;
            color: #20213B;
            margin-top: 6px;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        label {
            display: block;
            margin-top: 14px;
            font-size: 14px;
        }
        .app {
            max-width: 760px;
            margin: 0 auto;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: rgba(32, 40, 68, 0.24);
        }
        .logo {
            font-size: 29px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }
        .header-actions, .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .panel, .post {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 17px;
            margin-bottom: 16px;
            box-shadow: 0 5px 16px rgba(24, 25, 58, 0.12);
            overflow-wrap: anywhere;
        }
        .status {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            margin: 10px 0;
            overflow-wrap: anywhere;
        }
        .post-title {
            font-size: 20px;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }
        .post-date {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 12px;
        }
        .post-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.55;
            margin: 12px 0;
        }
        .editor {
            display: none;
        }
        .editor.open {
            display: block;
        }
        .check-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }
        .check-row input {
            width: 20px;
            height: 20px;
            margin: 0;
        }
        .primary {
            background: #263F83;
            font-weight: bold;
        }
        .danger {
            background: #704568;
        }
        .empty {
            text-align: center;
            color: var(--muted);
            padding: 28px 10px;
            line-height: 1.7;
        }
        footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            padding: 14px;
        }
        [hidden] {
            display: none !important;
        }
        @media (max-width: 480px) {
            body {
                padding: 10px 8px 28px;
            }
            header, .panel, .post {
                padding: 13px;
                border-radius: 14px;
            }
            .logo {
                font-size: 25px;
            }
            .header-actions {
                width: 100%;
            }
            .header-actions button {
                flex: 1;
            }
        }
    </style>
    <!-- Библиотека Supabase -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>
<div class="app">
    <header>
        <div>
            <div class="logo">MyFeed</div>
            <div class="subtitle">Твоя лента публикаций</div>
        </div>
        <div class="header-actions">
            <button id="loginButton" type="button"> Войти через Google </button>
            <button id="logoutButton" type="button" hidden> Выйти </button>
        </div>
    </header>

    <section class="panel">
        <div id="status" class="status" role="status" aria-live="polite"> Подключаемся к базе данных... </div>
        <button id="newButton" class="primary" type="button" disabled> + Новая публикация </button>
    </section>

    <section id="editor" class="panel editor">
        <h2>Новая публикация</h2>
        <form id="postForm">
            <label for="postTitle">Заголовок</label>
            <input id="postTitle" type="text" maxlength="200" placeholder="Введите заголовок">

            <label for="postText">Текст публикации</label>
            <textarea id="postText" maxlength="20000" placeholder="Напишите что-нибудь..."></textarea>

            <label class="check-row">
                <input id="allowComments" type="checkbox" checked>
                <span>Разрешить комментарии</span>
            </label>

            <div class="actions">
                <button id="saveButton" class="primary" type="submit"> Опубликовать </button>
                <button id="cancelButton" type="button"> Отмена </button>
            </div>
        </form>
    </section>

    <main id="feed" aria-live="polite">
        <div class="empty">Загружаем publications...</div>
    </main>

    <footer> MyFeed </footer>
</div>

<script>
(() => {
    "use strict";

    // =========================================
    // 1. НАСТРОЙКИ SUPABASE
    // =========================================
    const SUPABASE_URL = "https://wzypdsspmwopehcurzzx.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_HT9K7erIXZ2KuwxOIxKqiA_SVRA7EEo"; // <--- ВСТАВЬТЕ ВАШ КЛЮЧ СЮДА

    // =========================================
    // 2. ЭЛЕМЕНТЫ СТРАНИЦЫ
    // =========================================
    const statusElement = document.getElementById("status");
    const feed = document.getElementById("feed");
    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");
    const newButton = document.getElementById("newButton");
    const editor = document.getElementById("editor");
    const form = document.getElementById("postForm");
    const saveButton = document.getElementById("saveButton");
    const cancelButton = document.getElementById("cancelButton");

    let db = null;
    let currentUser = null;
    let loading = false;

    // =========================================
    // 3. СЛУЖЕБНЫЕ ФУНКЦИИ
    // =========================================
    function setStatus(message) {
        statusElement.textContent = message;
    }

    function showError(message, error) {
        console.error(message, error);
        const detail = error && error.message ? error.message : "Подробности доступны в консоли браузера.";
        setStatus(message + " " + detail);
    }

    function formatDate(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
            return "";
        }
        return date.toLocaleString("ru-RU");
    }

    function showEmpty(message) { feed.replaceChildren(); const box = document.createElement("div"); box.className = "empty"; box.textContent = message; feed.appendChild(box); } 


    function updateButtons() {
        loginButton.hidden = Boolean(currentUser);
        logoutButton.hidden = !currentUser;
        newButton.disabled = !currentUser;

        if (currentUser) {
            setStatus("Вы вошли в аккаунт: " + currentUser.email);
        } else {
            setStatus("База подключена. Войдите через Google, чтобы публиковать записи.");
        }
    }

    // =========================================
    // 4. РЕДАКТОР ПУБЛИКАЦИИ
    // =========================================
    function openEditor() {
        if (!currentUser) {
            setStatus("Сначала войдите через Google.");
            return;
        }
        form.reset();
        editor.classList.add("open");
        editor.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function closeEditor() {
        editor.classList.remove("open");
        form.reset();
    }

    // =========================================
    // 5. ОТОБРАЖЕНИЕ ПУБЛИКАЦИЙ
    // =========================================
    function renderPosts(posts) {
        feed.replaceChildren();

        if (!posts.length) {
            showEmpty("Публикаций пока нет. Создайте первую запись!");
            return;
        }

        for (const post of posts) {
            const card = document.createElement("article");
            card.className = "post";

            const title = document.createElement("h2");
            title.className = "post-title";
            title.textContent = post.title || "Без названия";

            const date = document.createElement("div");
            date.className = "post-date";
            date.textContent = formatDate(post.created_at);

            const text = document.createElement("div");
            text.className = "post-text";
            text.textContent = post.text || post.content || "";

            const comments = document.createElement("div");
            comments.className = "status";
            comments.textContent = post.allow_comment ? "💬 Комментарии разрешены" : "💬 Комментарии отключены";

            card.append(title, date);
            if (text.textContent) {
                card.appendChild(text);
            }
            card.appendChild(comments);
            feed.appendChild(card);
        }
    }

    // =========================================
    // 6. ЗАГРУЗКА ИЗ БАЗЫ ДАННЫХ
    // =========================================
    async function loadPosts() {
        if (!db || loading) return;
        loading = true;
        setStatus("Загружаем публикации из базы...");

        try {
            const { data, error } = await db
                .from("posts")
                .select("id, title,content, allow_comment, created_at")
                .order("created_at", { ascending: false });

            if (error) {
                throw error;
            }

            renderPosts(data || []);
            setStatus("Публикаций загружено: " + (data || []).length);
        } catch (error) {
            showEmpty("Не удалось загрузить публикации. Проверьте подключение и настройки таблицы posts.");
            showError("Ошибка загрузки публикаций из Supabase:", error);
        } finally {
            loading = false;
        }
    }

    // =========================================
    // 7. ВХОД ЧЕРЕЗ GOOGLE
    // =========================================
    async function signIn() {
        if (!db) {
            setStatus("Supabase не настроен. Проверьте адрес и Publishable key в коде.");
            return;
        }
        setStatus("Открываем вход через Google...");
        try {
            const { error } = await db.auth.signInWithOAuth({
                provider: "google",
                options: {
                    redirectTo: window.location.href.split("#")[0]
                }
            });
            if (error) {
                showError("Не удалось начать вход через Google:", error);
            }
        } catch (error) {
            showError("Ошибка входа через Google:", error);
        }
    }

    // =========================================
    // 8. ВЫХОД ИЗ АККАУНТА
    // =========================================
    async function signOut() {
        if (!db) return;
        try {
            const { error } = await db.auth.signOut();
            if (error) {
                throw error;
            }
            currentUser = null;
            closeEditor();
            updateButtons();
        } catch (error) {
            showError("Не удалось выйти из аккаунта:", error);
        }
    }

    // =========================================
    // 9. СОХРАНЕНИЕ НОВОЙ ПУБЛИКАЦИИ
    // =========================================
    async function savePost(event) {
        event.preventDefault();
        if (!db || !currentUser) {
            setStatus("Для сохранения публикации сначала войдите через Google.");
            return;
        }

        const title = document.getElementById("postTitle").value.trim();
        const text = document.getElementById("postText").value.trim();
        const allowComments = document.getElementById("allowComments").checked;

        if (!title && !text) {
            setStatus("Введите заголовок или текст публикации.");
            return;
        }

        saveButton.disabled = true;
        setStatus("Сохраняем публикацию в базе данных...");

        try {
            const { error } = await db
                .from("posts")
                .insert({
                    user_id: currentUser.id,
                    title: title || "Без названия",
                    text: text,
                    content: text,
                    allow_comment: allowComments
                });

            if (error) {
                throw error;
            }

            closeEditor();
            setStatus("Публикация сохранена в базе данных!");
            await loadPosts();
        } catch (error) {
            showError("Не удалось сохранить публикацию. Проверьте права доступа и структуру таблицы:", error);
        } finally {
            saveButton.disabled = false;
        }
    }

    // =========================================
    // 10. ЗАПУСК ПРИЛОЖЕНИЯ
    // =========================================
    async function start() {
        if (!window.supabase) {
            setStatus("Не удалось загрузить библиотеку Supabase. Проверьте интернет-соединение.");
            return;
        }

        try {
            db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

            const { data, error } = await db.auth.getSession();
            if (error) {
                throw error;
            }

            currentUser = data.session ? data.session.user : null;
            updateButtons();
            await loadPosts();

            db.auth.onAuthStateChange((_event, session) => {
                currentUser = session ? session.user : null;
                updateButtons();
                setTimeout(() => {
                    loadPosts();
                }, 0);
            });
        } catch (error) {
            showError("Ошибка подключения к Supabase:", error);
        }
    }

    // =========================================
    // 11. ОБРАБОТЧИКИ КНОПОК
    // =========================================
    loginButton.addEventListener("click", signIn);
    logoutButton.addEventListener("click", signOut);
    newButton.addEventListener("click", openEditor);
    cancelButton.addEventListener("click", closeEditor);
    form.addEventListener("submit", savePost);

    start();
})();
</script>
</body>
</html>
